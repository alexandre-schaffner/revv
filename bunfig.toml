[install]
peer = false

# Supply-chain hardening: npm worms (Shai-Hulud, Miasma) spread through
# freshly published versions that are usually pulled within hours, so a
# cooldown skips the window before IOCs are public.
# https://bun.com/docs/pm/cli/install#minimum-release-age
minimumReleaseAge = 259200 # seconds (3 days)

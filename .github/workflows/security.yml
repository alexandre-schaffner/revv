name: Code scanning

on:
  workflow_call:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependencies:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # Ignored advisories, each unreachable in Revv; drop the flag once a
      # patched version is in range.
      # - GHSA-3r8g-jcqq-3p5j: SvelteKit remote-functions `form` DoS. The web app
      #   is a static build (adapter-static) with no remote functions or server;
      #   the fix is only in Kit 3.1.1.
      # - GHSA-fc5q-39xc-vjpf: picomatch extglob ReDoS. Pulled in only by build
      #   tooling (vite, knip) matching our own globs; no patched release yet.
      - name: Audit Bun lockfile
        run: >-
          bun audit --audit-level high
          --ignore=GHSA-3r8g-jcqq-3p5j
          --ignore=GHSA-fc5q-39xc-vjpf
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Cargo lockfile
        run: cargo audit --file apps/desktop/Cargo.lock
      # GitHub reviews Cargo and Actions changes; bun audit above covers Bun transitive dependencies.
      - name: Review newly introduced dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

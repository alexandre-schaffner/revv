name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Top-level cap for the workflow's GITHUB_TOKEN. Must be ≥ the union of every
# scope any job (including the reusable `_build-tauri.yml`) requests, otherwise
# GitHub rejects the run at startup when the repo default is `read`.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  # ── Quality gates (fast, single runner) ───────────────────────
  check:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint & format (Biome)
        run: bun run lint

      - name: Check for unused files, exports, and dependencies (Knip)
        run: bun run knip

      - name: Build
        run: bun run build

  # ── release-please: opens/updates release PR; tags on merge ───
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Cross-platform Tauri builds ───────────────────────────────
  # Shared matrix lives in `_build-tauri.yml` and is reused by `nightly.yml`.
  build-tauri:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/_build-tauri.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      release_name: "Revv ${{ needs.release-please.outputs.version }}"
      prerelease: false
    secrets: inherit

  # ── Package and attest the signed installers ──────────────────
  package-installer:
    name: Package installer
    needs: [release-please, build-tauri]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build installer artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          REVV_VERSION: ${{ needs.release-please.outputs.version }}
        run: bash scripts/release/build-installer.sh

      - name: Attest install.sh
        id: attest-sh
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/install.sh

      - name: Attest install.ps1
        id: attest-ps1
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/install.ps1

      - name: Attest SHA256SUMS
        id: attest-sums
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/SHA256SUMS

      - name: Stage attestation bundles
        run: |
          cp "${{ steps.attest-sh.outputs.bundle-path }}"   dist/install.sh.sigstore
          cp "${{ steps.attest-ps1.outputs.bundle-path }}"  dist/install.ps1.sigstore
          cp "${{ steps.attest-sums.outputs.bundle-path }}" dist/SHA256SUMS.sigstore

      - name: Upload installer artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/install.sh \
            dist/install.ps1 \
            dist/SHA256SUMS \
            dist/install.sh.sigstore \
            dist/install.ps1.sigstore \
            dist/SHA256SUMS.sigstore \
            --clobber

  publish-release:
    name: Publish release
    needs: [release-please, package-installer]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false

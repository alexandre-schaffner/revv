name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] main-push identity, workflow ID, success, and SHA are API-validated before artifact access
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to recover; leave empty to reconcile tested main
        required: false
        type: string

permissions: {}

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tested source and release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.tested.outputs.sha }}
      ci_run_id: ${{ steps.tested.outputs.ci_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI on trusted main
        id: tested
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: python3 scripts/ci/trusted-run.py
      - name: Check main has not moved
        id: current
        if: inputs.tag == ''
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          current=false
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" == "$TESTED_SHA" ]]; then
            current=true
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: inputs.tag == '' && steps.current.outputs.current == 'true'
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release PR
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<< "$PR")"
      - name: Resolve release metadata
        id: resolve
        env:
          TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
          CREATED: ${{ steps.release.outputs.release_created }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$CREATED" == true || -n "$RECOVERY_TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build-tauri.yml # zizmor: ignore[self-repository] resolves from this trusted workflow commit
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      tag_name: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.sha }}
      ci_run_id: ${{ needs.prepare.outputs.ci_run_id }}
      version: ${{ needs.prepare.outputs.version }}
      nightly: false
      updater_notes: Revv ${{ needs.prepare.outputs.version }} is available.

  nix-pin:
    name: Pin the Nix flake to the release
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Pin nix/release.json
        run: bash nix/update-release.sh "$TAG"
      - name: Open the pin pull request
        run: |
          if git diff --quiet -- nix/release.json; then
            echo "nix/release.json already pins $TAG"
            exit 0
          fi
          branch="chore/nix-pin-$TAG"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "$branch already exists"
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          # Through the API rather than git push: the checkout holds no
          # credentials, and GitHub signs the commit.
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base" >/dev/null
          gh api -X PUT "repos/$GH_REPO/contents/nix/release.json" \
            -f "message=chore(nix): pin Revv.app to $TAG" \
            -f "content=$(base64 -w0 nix/release.json)" \
            -f "sha=$(git rev-parse "$base:nix/release.json")" \
            -f "branch=$branch" >/dev/null
          gh pr create --base main --head "$branch" \
            --title "chore(nix): pin Revv.app to $TAG" \
            --body "Moves \`nix/release.json\` to the published $TAG app bundle, so Nix installs pick up this release. Written by \`nix/update-release.sh\` in the Release workflow."
          # A pull request opened with GITHUB_TOKEN triggers no workflows.
          gh workflow run ci.yml --ref "$branch"

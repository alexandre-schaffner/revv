name: Nightly

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] main-push identity, workflow ID, success, and SHA are API-validated before artifact access
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tested nightly
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.tested.outputs.sha }}
      ci_run_id: ${{ steps.tested.outputs.ci_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI on trusted main
        id: tested
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/trusted-run.py
      - name: Create nightly draft for current main
        id: release
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          CI_NUMBER: ${{ steps.tested.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          # Coalesce superseded pushes before scheduling macOS. Once publishing
          # starts, a newer push cannot interrupt the artifact/signature upload.
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$TESTED_SHA" ]]; then
            echo 'A newer main commit exists; skip this nightly.'
            exit 0
          fi
          tag="nightly-${TESTED_SHA:0:7}"
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$TESTED_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$TESTED_SHA"
          fi
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [[ "$(cat draft.txt)" == false ]]; then
              echo 'This nightly is already published.'
              exit 0
            fi
          else
            gh release create "$tag" --target "$TESTED_SHA" --draft --prerelease --title "Revv nightly (${TESTED_SHA:0:7})" --notes "Auto-built from tested main @ $TESTED_SHA."
          fi
          base=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/apps/desktop/tauri.conf.json?ref=$TESTED_SHA" | jq -r .version)
          IFS=. read -r major minor patch <<< "$base"
          version="$major.$minor.$((patch + 1))-nightly.$CI_NUMBER"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build-tauri.yml # zizmor: ignore[self-repository] resolves from this trusted workflow commit
    with:
      tag_name: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.sha }}
      ci_run_id: ${{ needs.prepare.outputs.ci_run_id }}
      version: ${{ needs.prepare.outputs.version }}
      nightly: true
      updater_notes: Nightly build from tested main @ ${{ needs.prepare.outputs.sha }}.

  trim:
    name: Trim old nightlies
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retain ten published nightlies
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isPrerelease,isDraft,createdAt \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | startswith("nightly-")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                [[ "$tag" =~ ^nightly-[a-f0-9]{7,40}$ ]]
                gh release delete "$tag" --yes --cleanup-tag
              done

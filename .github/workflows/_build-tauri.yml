name: Build and publish Tauri

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      version:
        required: true
        type: string
      nightly:
        required: true
        type: boolean
      updater_notes:
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    if: inputs.nightly && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Check source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] trusted main source validated by the caller
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop -> target
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: frontend-${{ inputs.source_sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frontend
      - name: Restore tested frontend
        env:
          ARCHIVE: ${{ runner.temp }}/frontend/frontend.tar.gz
        run: |
          mkdir -p apps/web/build
          tar -xzf "$ARCHIVE" -C apps/web/build
          test "$(cat apps/web/build/source-sha.txt)" = "$SOURCE_SHA"
      - name: Stamp version
        run: |
          tmp=$(mktemp)
          jq --arg version "$VERSION" '.version = $version' apps/desktop/tauri.conf.json > "$tmp"
          mv "$tmp" apps/desktop/tauri.conf.json
      - name: Build unsigned app and DMG
        working-directory: apps/desktop
        run: bunx --no-install tauri build --ci --target "$TARGET" --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Verify and stage bundles
        run: python3 scripts/release/stage.py "$TARGET" "$ARCH" "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ inputs.tag_name }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || !inputs.nightly) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag_name }}
      RELEASE_VERSION: ${{ inputs.version }}
      REVV_VERSION: ${{ inputs.version }}
      NIGHTLY: ${{ inputs.nightly }}
      UPDATER_NOTES: ${{ inputs.updater_notes }}
      BUNDLE_DIR: dist
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ${{ inputs.nightly && format('unsigned-{0}-*', inputs.tag_name) || format('unsigned-ci-{0}-*', inputs.source_sha) }}
          run-id: ${{ inputs.nightly && github.run_id || inputs.ci_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - name: Validate unsigned artifacts
        run: python3 scripts/release/artifacts.py dist "$RELEASE_VERSION"
      # Install only a pinned signing tool, not workspace dependencies. Its lifecycle
      # scripts are disabled and the private key is exposed only to the signing step.
      - name: Install signature tools # zizmor: ignore[adhoc-packages] exact official CLI version, disabled lifecycle scripts, distro-signed verifier
        env:
          SIGNER_DIR: ${{ runner.temp }}/signer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          npm install --prefix "$SIGNER_DIR" --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.12.4
          echo "TAURI_SIGNER=$SIGNER_DIR/node_modules/.bin/tauri" >> "$GITHUB_ENV"
      - name: Sign and verify against committed updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/release/publish.py prepare
      - name: Attest application artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.dmg
            dist/*.app.tar.gz
      - name: Attest installer
        if: ${{ !inputs.nightly }}
        id: installer
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/install.sh
      - name: Attest checksums
        if: ${{ !inputs.nightly }}
        id: checksums
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/SHA256SUMS
      - name: Stage installer attestations
        if: ${{ !inputs.nightly }}
        env:
          INSTALLER_BUNDLE: ${{ steps.installer.outputs.bundle-path }}
          CHECKSUMS_BUNDLE: ${{ steps.checksums.outputs.bundle-path }}
        run: |
          cp "$INSTALLER_BUNDLE" dist/install.sh.sigstore
          cp "$CHECKSUMS_BUNDLE" dist/SHA256SUMS.sigstore
      - name: Publish complete draft and assert immutability
        run: python3 scripts/release/publish.py publish

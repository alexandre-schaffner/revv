name: Install Bun dependencies
description: Restore package downloads and perform a frozen install without the agent-only Effect checkout.
outputs:
  bun-version:
    description: Installed Bun version
    value: ${{ steps.bun.outputs.bun-version }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      id: bun
      with:
        bun-version-file: package.json
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: downloads
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
    - name: Install
      shell: bash
      env:
        CI: 'true'
      run: bun install --frozen-lockfile
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.downloads.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.downloads.outputs.cache-primary-key }}

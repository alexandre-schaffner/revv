name: revv-observability

services:
  pyroscope:
    image: grafana/pyroscope:2.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:4040:4040"
    command: ["-config.file=/etc/pyroscope/config.yaml"]
    volumes:
      - ./pyroscope.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope-data:/data

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.1,grafana-pyroscope-datasource@13.0.7
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin-password
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/revv-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - admin-password

secrets:
  admin-password:
    file: ${HOME}/.revv/telemetry/grafana-admin-password

volumes:
  pyroscope-data:
    name: revv-pyroscope-data
  grafana-data:
    name: revv-grafana-data
